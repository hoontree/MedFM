# Knowledge Distillation Configuration: SAM (teacher) -> TinyUSFM (student) — binary.
# Shared scaffolding: config/_distill_base.yaml. Only the direction, gpu, and the
# reliability-analysis block below are specific to this entry.
defaults:
  - _distill_base
  - _self_

teacher: sam
student: tinyusfm

hardware:
  gpu_ids: [3]

# Reliability-map analysis (tools/analyze_reliability.py only; unused by distill.py).
analysis:
  loader: null            # null -> first test loader; or a dataset name e.g. BUID
  num_batches: 4          # batches to aggregate stats over
  num_panels: 12          # per-sample qualitative panels to render
  student_checkpoint: null  # optional distilled-student ckpt; null -> ft student
