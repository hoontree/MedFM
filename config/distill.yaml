# Knowledge Distillation Configuration
defaults:
  - data: dynamic
  - method: unified
  - training: distillation
  - wandb: distill
  - _self_

trainer:
  _target_: trainers.distill_trainer.DistillTrainer

# Teacher / Student model names — resolved against config/model/{name}.yaml.
# Each model yaml is expected to expose `binary_checkpoint` and
# `multiclass_checkpoint`; the appropriate one is selected from data.num_classes.
teacher: sam
student: tinyusfm

# Optional checkpoint override applied on top of the resolved teacher/student
# model config (e.g. to pick a specific trained artifact — a balanced-sampler
# run, a particular ablation — without needing a dedicated model yaml just to
# swap one path).
teacher_checkpoint: null
student_checkpoint: null

# Hardware Configuration (Global Overrides)
hardware:
  gpu_ids: [1]
  seed: 42

# Global Flags
debug: false

# Resume: null/false = fresh run; "auto" = reuse latest matching run dir with a
# checkpoints/last.pth; or an explicit path to last.pth / a run dir.
resume: null

# Output & Visualization
output:
  dir: logs

visualization:
  num_samples: 10
