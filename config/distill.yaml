# Knowledge Distillation Configuration
defaults:
  - data: dynamic
  - teacher: E0_AL_DL
  - student: tinyusfm
  - method: unified
  - training: distillation
  - log: wandb
  - _self_

trainer:
  _target_: trainers.distill_trainer.DistillTrainer

# Hardware Configuration (Global Overrides)
hardware:
  gpu_ids: [3]
  seed: 42

# Global Flags
debug: false
use_gradnorm: false

# Output & Visualization
output:
  dir: logs

visualization:
  num_samples: 10
