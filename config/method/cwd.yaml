# Channel-wise Knowledge Distillation (CWD) preset
# Reference: Shu et al., "Channel-wise Knowledge Distillation for Dense
# Prediction", ICCV 2021. Re-implemented from scratch — submodule code is
# pinned to PyTorch 0.4.1 and is not imported here.
#
# Application points (binary medical segmentation, TinyUSFM → SAM):
#   - delta: CWD on the final logit map (replaces vanilla per-pixel KL)
#   - zeta : CWD on intermediate features
#
# Recipes:
#   - logit-only:   w_logit_kd=0, w_logit_cwd=1, w_feature_cwd=0
#   - feature-only: w_logit_kd=0, w_logit_cwd=0, w_feature_cwd=1
#   - combined:     w_logit_kd=0, w_logit_cwd=1, w_feature_cwd=1   (paper's "single+whole")

_target_: distillers.UnifiedDistiller

name: cwd
temperature: 4.0
cwd_temperature: 4.0

# Disable vanilla KL — CWD takes its place
w_task:        1.0
w_logit_kd:    0.0
w_logit_cwd:   1.0   # logit-CWD
w_feature_cwd: 0.0   # feature-CWD

# Task loss components
use_dice: true
use_ce: true

# Feature pairs for w_feature_cwd>0 (auto-resolves block paths/channels per model)
feature_pairs: [7, 9, 11]

# Uncertainty-weighted KD off in CWD baseline
use_uncertainty_weighted_kd: false
w_uncertainty_kd: 0.0
