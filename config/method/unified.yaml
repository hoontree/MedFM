# Unified Distillation Configuration
# Supports: Task Loss, Logit KD, Feature KD, Attention KD, Alignment KD

_target_: distillers.UnifiedDistiller

name: unified
temperature: 4.0

# Loss weights (Set to 0.0 to disable a component)
alpha: 1.0        # Task loss (GT Dice/CE)
beta: 1.0         # Logit KD (KL Divergence)
gamma: 0        # Feature KD (MSE on intermediate layers)
gamma_attn: 0.5   # Attention Map KD (MSE)
gamma_align: 1  # Alignment Layer KD (MSE)

# Task loss components
use_dice: true
use_ce: true

# --- Feature Distillation Settings (gamma > 0) ---
layer_mapping:
  backbone.blocks.0: sam.image_encoder.blocks.0
  backbone.blocks.2: sam.image_encoder.blocks.2
  backbone.blocks.4: sam.image_encoder.blocks.4
  backbone.blocks.6: sam.image_encoder.blocks.6
  backbone.blocks.8: sam.image_encoder.blocks.8
  backbone.blocks.10: sam.image_encoder.blocks.10

layer_channels:
  backbone.blocks.0: 192
  backbone.blocks.2: 192
  backbone.blocks.4: 192
  backbone.blocks.6: 192
  backbone.blocks.8: 192
  backbone.blocks.10: 192

  sam.image_encoder.blocks.0: 768
  sam.image_encoder.blocks.1: 768
  sam.image_encoder.blocks.2: 768
  sam.image_encoder.blocks.3: 768
  sam.image_encoder.blocks.4: 768
  sam.image_encoder.blocks.5: 768
  sam.image_encoder.blocks.6: 768
  sam.image_encoder.blocks.7: 768
  sam.image_encoder.blocks.8: 768
  sam.image_encoder.blocks.9: 768
  sam.image_encoder.blocks.10: 768
  sam.image_encoder.blocks.11: 768

# --- Advanced Distillation Losses (lambda > 0) ---
lambda_boundary: 0.1     # Boundary KD (Sobel edge map)
lambda_shape: 0.2        # Shape KD (Signed Distance Transform)
lambda_uncertainty: 0.2  # Uncertainty KD (Entropy map)

# --- GradNorm Configuration ---
use_gradnorm: ${use_gradnorm}      # Automatically balance loss weights
gradnorm_alpha: 0.1      # Update rate for GradNorm (alpha damping)
reference_layer: backbone.blocks.11  # Reference layer for gradient matching
