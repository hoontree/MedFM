# Unified Distillation Configuration

_target_: distillers.UnifiedDistiller

name: unified
temperature: 4.0

# Loss weights (set to 0.0 to disable a component)
alpha: 1.0   # Task loss (GT Dice/CE)
beta: 1.0    # Logit KD (KL Divergence)
gamma: 0     # Feature KD (MSE on intermediate layers)
delta: 0.0   # Channel-wise distillation on logits  (CWD, ICCV 2021)
zeta: 0.0    # Channel-wise distillation on features (CWD on intermediate layers)

# CWD temperature (defaults to `temperature` if unset). Paper recommends τ=4.
cwd_temperature: 4.0

# Task loss components
use_dice: true
use_ce: true

# --- Feature Distillation Settings (gamma > 0 or zeta > 0) ---
# Just list transformer block indices to align between teacher & student.
# Module paths and channel counts are auto-detected, so the same yaml works
# regardless of which model is teacher vs student.
feature_pairs: [7, 9, 11]

# --- Uncertainty-Weighted KD (disabled by default) ---
use_uncertainty_weighted_kd: true
kd_lambda: 1.0                   # weight for uncertainty KD term in total loss
kd_tau: 4.0                      # temperature (defaults to same as `temperature`)
uncertainty_weight_type: linear  # "linear" or "exp"
uncertainty_beta: 1.0            # decay rate for exp mode
uncertainty_eps: 1.0e-8          # log-stability epsilon for entropy
