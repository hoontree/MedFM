# Multiclass (3-class: bg/benign/malignant) teacher-strength sweep — teacher =
# SAM vit_b full-FT (weakest SAM), student = TinyUSFM. Low-strength anchor of the
# MULTICLASS spectrum. `teacher=sam` + num_classes=3 → load_model_cfg selects
# sam.yaml's multiclass_checkpoint (Phase A artifact). Run AFTER the vit_b MC
# teacher exists. Method set + shared overrides: _teacher_strength_base.yaml.
#
#   uv run tools/run_reliability_ablation.py \
#       --manifest config/sweeps/teacher_strength_vitb_mc.yaml \
#       --workers local:1,local:2,local:3,gpu2:1,gpu2:2

extends: _teacher_strength_base.yaml
group_label: teacher_strength_mc/vit_b

base_overrides:
  - teacher=sam
  - data.num_classes=3
