# WandB Sweep Configuration for Teacher Training (Adaptation)
# encoder=frozen, decoder=frozen, alignment=true

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  # Model Structural Hyperparameters
  model.alignment_num_blocks:
    values: [2, 4, 8]
  model.r_d:
    values: [4]
  model.r_e:
    values: [4]
    
  # Training Hyperparameters
  training.lr:
    values: [0.0001, 0.00005, 0.0002, 0.00001]
  training.batch_size:
    values: [4, 8, 16]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=frozen
  - model.decoder_mode=frozen
  - model.use_alignment=true
  - training.num_epochs=100
  - wandb.project=medical_foundation_models_teacher_sweep
