# WandB Sweep Configuration - GPU 1
# encoder=frozen, alignment=true, decoder sweep (ft, frozen)
project: medfm_distill_sweep

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.decoder_mode:
    values: [ft, frozen]
  model.alignment_num_blocks:
    values: [2, 4, 8]

# Hydra command pattern
command:
  - .venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=frozen
  - model.use_alignment=true
  - pipeline.enabled=true
  - hardware.gpu_ids=[1]
  - wandb.project=medfm_distill_sweep
