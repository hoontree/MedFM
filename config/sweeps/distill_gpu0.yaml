# DEPRECATED: Legacy distillation-only sweep. Prefer train.py pipeline sweeps.
# WandB Sweep Configuration - GPU 0
# Models: E0_AL_DL
project: medfm_teacher_sweep

program: distill.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model:
    values: [E0_AL_DL]
  model.alignment_num_blocks:
    values: [2, 4, 8]
  model.r_d:
    values: [1, 2, 4]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]
    
  method.beta:
    values: [0, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - hardware.gpu_ids=[0]
  - wandb.project=medfm_distill_sweep
