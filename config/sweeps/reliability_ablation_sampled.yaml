# Reliability-aware KD factor ablation — SAMPLING-ON variant.
#
# Identical axes to reliability_ablation.yaml, but every run uses:
#   * teacher = SAM full-FT trained WITH the balanced sampler (val 0.682),
#   * student = TinyUSFM trained WITH the balanced sampler.
# This replaces the old ablation whose teacher was the under-tuned non-sampled
# FT artifact (val 0.57) and whose student had sampling off. Makes the factor
# ablation consistent with the sampling-on premise used everywhere else.
#
# Run:
#   uv run tools/run_reliability_ablation.py \
#       --manifest config/sweeps/reliability_ablation_sampled.yaml \
#       --workers local:2,local:3

group_label: reliability_kd/factor_ablation_sampled

base_overrides:
  - method=unified
  - teacher=sam
  - teacher_checkpoint=experiment_results/SAM_multiclass_ft_sampled/checkpoints/best.pth
  - student=tinyusfm
  - data.sampling.enabled=true
  - method.w_task=1.0
  - method.w_reliability_kd=1.0
  - method.w_logit_kd=0.0
  - method.w_logit_cwd=0.0
  - method.w_feature_cwd=0.0
  - method.w_uncertainty_kd=0.0

experiments:
  # --- A. Baselines (context) ---
  base_task_only:
    - method.w_reliability_kd=0.0
  base_logit_kd:
    - method.w_reliability_kd=0.0
    - method.w_logit_kd=1.0
  base_uncertainty_kd:
    - method.w_reliability_kd=0.0
    - method.w_uncertainty_kd=1.0
    - method.use_uncertainty_weighted_kd=true

  # --- B. Additive factor build-up (entropy_penalty fixed ON) ---
  b0_base:                                  # confidence x entropy
    - method.reliability_kd.use_teacher_correctness_gate=false
    - method.reliability_kd.use_student_bypass=false
  b1_teacher_gate:                          # + teacher correctness gate
    - method.reliability_kd.use_student_bypass=false
  b2_student_bypass: []   # == unified.yaml default (full map)
  b3_smoothing:                             # + prediction-aware spatial smoothing
    - method.reliability_kd.use_reliability_smoothing=true

  # --- B'. Leave-one-out from the full map ---
  lo_no_teacher_gate:
    - method.reliability_kd.use_teacher_correctness_gate=false
  lo_no_student_bypass:
    - method.reliability_kd.use_student_bypass=false

  # --- D. Gate weight sensitivity ---
  tg_wrong_0.1:
    - method.reliability_kd.teacher_correctness_wrong_weight=0.1
  tg_wrong_0.5:
    - method.reliability_kd.teacher_correctness_wrong_weight=0.5
  sb_weight_0.0:
    - method.reliability_kd.student_bypass_weight=0.0
  sb_weight_0.3:
    - method.reliability_kd.student_bypass_weight=0.3

  # --- E. Temperature ---
  temp_2.0:
    - method.temperature=2.0
    - method.reliability_kd.temperature=2.0
  temp_4.0:
    - method.temperature=4.0
    - method.reliability_kd.temperature=4.0
  temp_6.0:
    - method.temperature=6.0
    - method.reliability_kd.temperature=6.0
  temp_8.0:
    - method.temperature=8.0
    - method.reliability_kd.temperature=8.0

  # --- F. Batch size ---
  bs_4:
    - training.batch_size=4
  bs_8:
    - training.batch_size=8
  bs_16:
    - training.batch_size=16
