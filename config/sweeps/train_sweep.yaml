# WandB Sweep Configuration for Teacher Training (Adaptation)
# Run this with: wandb sweep config/train_sweep.yaml

program: train.py
method: grid # grid, random, bayes
metric:
  name: pipeline/distill_final_dice
  goal: maximize

parameters:
  model:
    values: [E0_AL_D0, E0_AL_DL, E0_AL_DF, E0_D0, E0_DL, E0_DF]
  # Model Structural Hyperparameters
  model.alignment_num_blocks:
    values: [2, 4, 8]
  model.r_d:
    values: [1, 2, 4]

  distillation.adaptation_ratio:
    values: [0.3, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - pipeline.enabled=true
  - distillation.enabled=true
  - distillation.phase=adaptation
  - wandb.disabled=true
  - wandb.project=medical_foundation_models_teacher_sweep
