# WandB Sweep Configuration - GPU 1
# Models: E0_AL_DF, E0_AL_D0
project: medfm_teacher_sweep

program: train.py
method: grid
metric:
  name: pipeline/distill_final_dice
  goal: maximize

parameters:
  model:
    values: [E0_AL_DF, E0_AL_D0]
  model.alignment_num_blocks:
    values: [2, 4, 8]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - pipeline.enabled=true
  - distillation.enabled=true
  - distillation.phase=adaptation
  - wandb.disabled=true
  - hardware.gpu_ids=[1]
  - wandb.project=medfm_teacher_sweep
