# Reliability-aware KD, TinyUSFM -> SAM direction (teacher = TinyUSFM, student =
# SAM) + BALANCED SAMPLING enabled (config/data/dynamic.yaml `sampling` block).
#
# Sampling-on twin of reliability_teacher_tinyusfm.yaml. Same methods/knobs, but
# the train loader uses the dataset-/class-balanced WeightedRandomSampler.
#
# Sampling policy here = dataset rebalance only:
#   - alpha=0.5  (sqrt tempering; curbs BUSBRA dominance, exposes small B)
#   - decouple_dataset_class=true  (p_d ∝ N_d^0.5 exactly)
#   - class_weights uniform, normal_cap null  (isolate the dataset effect)
#
# Experiment names are `smpl_*` so run_name=relab_smpl_* stays distinct from the
# non-sampled relab_* runs (separate W&B run names, separate resume detection).
#
# Run (sequential, single worker on the gpu3 node):
#   uv run tools/run_reliability_ablation.py \
#       --manifest config/sweeps/reliability_teacher_tinyusfm_sampled.yaml \
#       --group reliability_teacher_tinyusfm_sampled --workers gpu3:0

base_overrides:
  - method=unified
  - teacher=tinyusfm
  - student=sam
  - method.w_task=1.0
  - method.w_reliability_kd=1.0
  - method.w_logit_kd=0.0
  - method.w_logit_cwd=0.0
  - method.w_feature_cwd=0.0
  - method.w_uncertainty_kd=0.0
  # --- balanced sampling (dataset rebalance only) ---
  - data.sampling.enabled=true
  - data.sampling.alpha=0.5
  - data.sampling.decouple_dataset_class=true
  - data.sampling.normal_cap=null

experiments:
  # --- Core comparison: target-only vs reliability ---
  smpl_task_only:
    - method.w_reliability_kd=0.0
  smpl_reliability: []             # full reliability map (T=4 default)

  # --- Hyperparameter comparison (reliability/KD knobs; centre = reliability) ---
  smpl_temp_2.0:
    - method.temperature=2.0
    - method.reliability_kd.temperature=2.0
  smpl_temp_8.0:
    - method.temperature=8.0
    - method.reliability_kd.temperature=8.0
  smpl_tg_wrong_0.25:
    - method.reliability_kd.teacher_correctness_wrong_weight=0.25
  smpl_sb_weight_0.3:
    - method.reliability_kd.student_bypass_weight=0.3
