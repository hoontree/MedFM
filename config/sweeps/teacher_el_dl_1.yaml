# WandB Sweep Configuration - GPU 1
# encoder=lora, decoder=lora, alignment=true
project: medfm_teacher_adaptation

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  training.lr:
    values: [1e-5, 3e-5, 1e-4]
  model.r_e:
    values: [4, 8]
  model.r_d:
    values: [4, 8]


# Hydra command pattern
command:
  - .venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=lora
  - model.decoder_mode=lora
  - model.use_alignment=false
  - hardware.gpu_ids=[1]
  - wandb.project=medfm_teacher_adaptation
