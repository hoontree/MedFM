# Fair comparison: both teachers trained WITH balanced sampling, student also
# trained with sampling. Isolates teacher adaptation (FT vs LoRA) under a
# matched data-sampling regime.
#
# Teachers (val Dice, trained with sampling=on, same recipe):
#   sam        + teacher_checkpoint=...ft_sampled...   = SAM full-FT   (0.6815)
#   sam_lora   + teacher_checkpoint=...lora_sampled...  = SAM LoRA r4   (0.7201)
# (model.name is the plain sam/sam_lora config; the *_sampled checkpoint override
# points at the artifact actually trained with balanced sampling — see
# teacher_checkpoint= below. There is no separate sam_ft_sampled.yaml anymore.)
# Student = TinyUSFM, sampling=on.
#
# task_only is teacher-independent (KD off) -> a single baseline. Each KD method
# is run once per sampled teacher.
#
# Run:
#   uv run tools/run_reliability_ablation.py \
#       --manifest config/sweeps/reliability_teacher_sampled.yaml \
#       --workers gpu4:0,gpu4:1,gpu4:2,gpu4:3

group_label: reliability_kd/teacher_ft_vs_lora_sampled

base_overrides:
  - method=unified
  - student=tinyusfm
  - data.sampling.enabled=true        # student trained with balanced sampler
  - method.w_task=1.0
  - method.w_reliability_kd=1.0
  - method.w_logit_kd=0.0
  - method.w_logit_cwd=0.0
  - method.w_feature_cwd=0.0
  - method.w_uncertainty_kd=0.0

experiments:
  # no-KD baseline (teacher loaded but unused -> teacher-independent)
  task_only:
    - teacher=sam_lora
    - teacher_checkpoint=experiment_results/SAM_multiclass_lora_sampled/checkpoints/best.pth
    - method.w_reliability_kd=0.0
  # FT-sampled teacher
  ft_logit_kd:
    - teacher=sam
    - teacher_checkpoint=experiment_results/SAM_multiclass_ft_sampled/checkpoints/best.pth
    - method.w_reliability_kd=0.0
    - method.w_logit_kd=1.0
  ft_reliability:
    - teacher=sam
    - teacher_checkpoint=experiment_results/SAM_multiclass_ft_sampled/checkpoints/best.pth
  ft_uncertainty_kd:
    - teacher=sam
    - teacher_checkpoint=experiment_results/SAM_multiclass_ft_sampled/checkpoints/best.pth
    - method.w_reliability_kd=0.0
    - method.w_uncertainty_kd=1.0
  # LoRA-sampled teacher
  lora_logit_kd:
    - teacher=sam_lora
    - teacher_checkpoint=experiment_results/SAM_multiclass_lora_sampled/checkpoints/best.pth
    - method.w_reliability_kd=0.0
    - method.w_logit_kd=1.0
  lora_reliability:
    - teacher=sam_lora
    - teacher_checkpoint=experiment_results/SAM_multiclass_lora_sampled/checkpoints/best.pth
  lora_uncertainty_kd:
    - teacher=sam_lora
    - teacher_checkpoint=experiment_results/SAM_multiclass_lora_sampled/checkpoints/best.pth
    - method.w_reliability_kd=0.0
    - method.w_uncertainty_kd=1.0
