# WandB Sweep Configuration - GPU 1
# encoder=frozen, alignment=true, decoder sweep (ft, frozen)
project: medfm_teacher_sweep

program: train.py
method: grid
metric:
  name: final_test/BUID/dice
  goal: maximize

parameters:
  model.decoder_mode:
    values: [ft, frozen]
  model.alignment_num_blocks:
    values: [2, 4, 8]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=frozen
  - model.use_alignment=true
  - pipeline.enabled=true
  - wandb.disabled=true
  - hardware.gpu_ids=[1]
  - wandb.project=medfm_teacher_sweep
