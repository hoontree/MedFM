# WandB Sweep Configuration - GPU 2
# encoder=conv_lora, decoder=lora
project: medfm_distill_sweep

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.r_e:
    values: [4, 8]
  model.conv_lora_expert_num:
    values: [4, 8]
  model.r_d:
    values: [2, 4, 8]

# Hydra command pattern
command:
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=conv_lora
  - model.decoder_mode=lora
  - model.use_alignment=false
  - pipeline.enabled=true
  - hardware.gpu_ids=[2]
  - wandb.project=medfm_distill_sweep
