# WandB Sweep Configuration - GPU 0
# encoder=frozen, decoder=lora, alignment=true
project: medfm_teacher_sweep

program: distill.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  teacher.alignment_num_blocks:
    values: [2, 4, 8]
  teacher.r_d:
    values: [1, 2, 4]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]
    
  method.beta:
    values: [0, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - teacher.encoder_mode=frozen
  - teacher.decoder_mode=lora
  - hardware.gpu_ids=[0]
  - wandb.project=medfm_distill_sweep
