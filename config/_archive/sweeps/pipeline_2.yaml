# WandB Sweep Configuration - GPU 2
# encoder=frozen, decoder=lora, no alignment
project: medfm_distill_sweep

program: distill.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.r_d:
    values: [1, 2, 4]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - teacher.encoder_mode=frozen
  - teacher.decoder_mode=lora
  - teacher.use_alignment=false
  - pipeline.enabled=true
  - wandb.disabled=true
  - hardware.gpu_ids=[1]
  - wandb.project=medfm_distill_sweep
