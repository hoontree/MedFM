# WandB Sweep Configuration - GPU 1
# encoder=frozen, alignment=true, decoder sweep (ft, frozen)
project: medfm_teacher_sweep

program: distill.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  teacher.decoder_mode:
    values: [ft, frozen]
  teacher.alignment_num_blocks:
    values: [2, 4, 8]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]

  method.beta:
    values: [0, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - teacher.encoder_mode=frozen
  - teacher.use_alignment=true
  - hardware.gpu_ids=[1]
  - wandb.project=medfm_distill_sweep
