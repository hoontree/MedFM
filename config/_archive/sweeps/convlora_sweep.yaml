# WandB Sweep Configuration - ConvLoRA encoder variants
project: sam_convlora

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.encoder_mode:
    values: [conv_lora]
  model.decoder_mode:
    values: [frozen, lora, ft]
  model.use_alignment:
    values: [false]
  training.moe_loss_weight:
    values: [0.3, 0.5, 0.7]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - gpu_ids=[0]
  - wandb.project=sam_convlora
