# WandB Sweep Configuration - SAM encoder frozen variants
project: sam_sweep

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.encoder_mode:
    values: [frozen]
  model.decoder_mode:
    values: [lora, frozen, ft]
  model.use_alignment:
    values: [false]
  model.sam_type:
    values: [vit_h, vit_l]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - hardware.gpu_ids=[1]
  - wandb.project=sam_sweep
