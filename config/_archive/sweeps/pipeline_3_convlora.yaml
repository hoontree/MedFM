# WandB Sweep Configuration - GPU 3
# encoder=conv_lora, decoder sweep (frozen, ft)
project: medfm_distill_sweep

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.decoder_mode:
    values: [frozen, ft]
  model.conv_lora_expert_num:
    values: [4, 8]

# Hydra command pattern
command:
  - .venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=conv_lora
  - model.use_alignment=false
  - pipeline.enabled=true
  - hardware.gpu_ids=[3]
  - wandb.project=medfm_distill_sweep
