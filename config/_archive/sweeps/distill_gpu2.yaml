# WandB Sweep Configuration - GPU 2
# encoder=frozen, decoder=lora, no alignment
project: medfm_teacher_sweep

program: distill.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  teacher.r_d:
    values: [1, 2, 4]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]

  method.beta:
    values: [0, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - teacher.encoder_mode=frozen
  - teacher.decoder_mode=lora
  - teacher.use_alignment=false
  - hardware.gpu_ids=[2]
  - wandb.project=medfm_distill_sweep
