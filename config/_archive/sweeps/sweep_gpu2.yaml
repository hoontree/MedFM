# WandB Sweep Configuration - GPU 2
# encoder=frozen, decoder=lora, no alignment
project: medfm_teacher_sweep

program: train.py
method: grid
metric:
  name: final_test/BUID/dice
  goal: maximize

parameters:
  model.r_d:
    values: [1, 2, 4]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=frozen
  - model.decoder_mode=lora
  - model.use_alignment=false
  - pipeline.enabled=true
  - wandb.disabled=true
  - hardware.gpu_ids=[2]
  - wandb.project=medfm_teacher_sweep
