# WandB Sweep Configuration - GPU 0
# decoder=fpn
project: medical_foundation_models

name: tinyusfm_decoder_fpn

program: train.py
method: grid
metric:
  name: final_test/BUID/Dice
  goal: maximize

parameters:
  training.lr:
    values: [0.0001, 0.0005, 0.001]
  training.batch_size:
    values: [16, 32, 64]
  training.train_head_only:
    values: [true, false]

command:
  - .venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.decoder_type=fpn
  - hardware.gpu_ids=[0]