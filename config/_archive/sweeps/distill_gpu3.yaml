# WandB Sweep Configuration - GPU 3
# encoder=frozen, no alignment, decoder sweep (frozen, ft)
project: medfm_teacher_sweep

program: distill.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  teacher.decoder_mode:
    values: [frozen, ft]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]

  method.beta:
    values: [0, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - teacher.encoder_mode=frozen
  - teacher.use_alignment=false
  - hardware.gpu_ids=[3]
  - wandb.project=medfm_distill_sweep
