# WandB Sweep Configuration - GPU 3
# encoder=frozen, no alignment, decoder sweep (frozen, ft)
project: medfm_teacher_sweep

program: train.py
method: grid
metric:
  name: final_test/BUID/dice
  goal: maximize

parameters:
  model.decoder_mode:
    values: [frozen, ft]
  distillation.adaptation_ratio:
    values: [0.3, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - model.encoder_mode=frozen
  - model.use_alignment=false
  - pipeline.enabled=true
  - wandb.disabled=true
  - hardware.gpu_ids=[3]
  - wandb.project=medfm_teacher_sweep
