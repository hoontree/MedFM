# WandB Sweep Configuration - GPU 0
# encoder=frozen, decoder=lora, alignment=true
project: medfm_distill_sweep

program: train.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.alignment_num_blocks:
    values: [2, 4, 8]
  model.r_d:
    values: [1, 2, 4]

# Hydra command pattern
command:
  - .venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - teacher.encoder_mode=frozen
  - teacher.decoder_mode=lora
  - teacher.use_alignment=true
  - pipeline.enabled=true
  - hardware.gpu_ids=[0]
  - wandb.project=medfm_distill_sweep
