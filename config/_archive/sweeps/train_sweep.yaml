# WandB Sweep Configuration for Teacher Training (Adaptation)
# Run this with: wandb sweep config/sweeps/train_sweep.yaml

program: train.py
method: grid
metric:
  name: final_test/BUID/dice
  goal: maximize

parameters:
  # Model Architecture Sweep
  model.encoder_mode:
    values: [frozen, conv_lora]
  model.decoder_mode:
    values: [frozen, lora, ft]
  model.use_alignment:
    values: [true, false]

  # Model Structural Hyperparameters
  model.alignment_num_blocks:
    values: [2, 4, 8]
  model.r_d:
    values: [1, 2, 4]

  distillation.adaptation_ratio:
    values: [0.3, 1.0]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - pipeline.enabled=true
  - wandb.disabled=true
  - wandb.project=medical_foundation_models_teacher_sweep
