# WandB Sweep Configuration - GPU 3
# encoder=frozen, no alignment, decoder sweep (frozen, ft)
project: medfm_distill_sweep

program: distill.py
method: grid
metric:
  name: epoch_val/Dice
  goal: maximize

parameters:
  model.decoder_mode:
    values: [frozen, ft]

# Hydra command pattern
command:
  - ${env}
  - ./.venv/bin/python
  - ${program}
  - ${args_no_hyphens}
  - teacher.encoder_mode=frozen
  - teacher.use_alignment=false
  - pipeline.enabled=true
  - wandb.disabled=true
  - hardware.gpu_ids=[1]
  - wandb.project=medfm_distill_sweep
