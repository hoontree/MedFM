# Knowledge Distillation Configuration: TinyUSFM (teacher) -> SAM (student) — binary
defaults:
  - data: dynamic
  - method: cwd_feature
  - training: distillation
  - _self_

trainer:
  _target_: trainers.distill_trainer.DistillTrainer

teacher: tinyusfm
student: sam

# Hardware Configuration (Global Overrides)
hardware:
  gpu_ids: [2]
  seed: 42

# Global Flags
debug: false
use_gradnorm: false

# Output & Visualization
output:
  dir: logs

visualization:
  num_samples: 10
