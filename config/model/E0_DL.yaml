# @package _global_
# SAM: Encoder frozen + Decoder LoRA (E0_DL)

defaults:
  - _self_
  - /training: sam_training

trainer:
  _target_: trainers.sam_trainer.SAMTrainer

model:
  _target_: model.sam_hybrid_adapter.build_sam_hybrid
  name: E0_DL
  sam_type: vit_b
  num_classes: ${data.num_classes}
  img_size: ${data.img_size}
  adaptation_mode: encoder_frozen_decoder_lora
  r_e: 4
  r_d: 4
  sam_checkpoint: checkpoints/sam_vit_b_01ec64.pth
  checkpoint: null  # Set to path to load trained weights
