# @package _global_

# SAM3 Model Configuration
# SAM3 is Meta's latest Segment Anything Model with improved performance.
#
# Two training modes are available:
# 1. Simple mode (default): Uses SAM3TrainerAdapter with BaseTrainer interface
# 2. Native mode: Uses SAM3Orchestrator with full SAM3 capabilities
#
# Usage (same datasets/split as every other model — train_sam.yaml's default
# `data: dynamic` group, i.e. BUSBRA/BUSI/B — but SAM3's model expects a
# BatchedDatapoint, not a plain image/mask tensor, so training actually reads
# the COCO-JSON manifest below, not `data:` directly. Generate it first:
#   uv run tools/generate_sam3_coco_annotations.py
#
#   # Simple training
#   uv run train.py model=sam3
#
#   # With custom config
#   uv run train.py model=sam3 sam3.resolution=1024 training.batch_size=2
#
#   # Native mode (advanced)
#   uv run train.py model=sam3 sam3.use_native_trainer=true

defaults:
  - _self_

trainer:
  _target_: trainers.sam3_adapter.SAM3TrainerAdapter

# Model identification
model:
  name: sam3
  img_size: 1008

# SAM3-specific configuration
sam3:
  # Use native SAM3 trainer (advanced) vs adapter (simple)
  use_native_trainer: false

  # Model checkpoint (null for pretrained from HuggingFace)
  checkpoint_path: null

  # BPE path for text encoder (relative to project root)
  bpe_path: model/sam3/assets/bpe_simple_vocab_16e6.txt.gz

  # Enable segmentation masks (vs detection only)
  enable_segmentation: true

  # Input resolution
  resolution: 1008

  # Learning rate scale factor
  lr_scale: 0.1

  # AMP (Automatic Mixed Precision)
  amp_enabled: true
  amp_dtype: bfloat16  # bfloat16 or float16

  # Validation frequency
  val_epoch_freq: 1

  # Logging frequency (iterations)
  log_freq: 10

  # Normalization (SAM3 uses [0.5, 0.5, 0.5])
  norm_mean: [0.5, 0.5, 0.5]
  norm_std: [0.5, 0.5, 0.5]

  # COCO-JSON manifest produced by tools/generate_sam3_coco_annotations.py —
  # the real, native SAM3 data path (see _create_sam3_coco_dataloaders in
  # trainers/sam3_adapter.py). Keys index into the generated manifest.json;
  # train/val entries are concatenated (ConcatDataset), matching the
  # BUSBRA+BUSI+B combination every other model trains on.
  coco_manifest: datasets/sam3_coco/manifest.json
  coco_train_datasets: [BUSBRA_train, BUSI_train, B_train]
  coco_val_datasets: [BUSBRA_val, BUSI_val, B_val]
  max_ann_per_img: 100
  max_train_queries: 50
  max_val_queries: 50

# Training configuration
training:
  num_workers: 4
  max_epochs: 20
  batch_size: 1                       # SAM3 typically uses small batch sizes
  base_lr: 0.0001
  weight_decay: 0.1
  gradient_accumulation_steps: 1
  save_interval: 5

  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001

# Optimizer configuration
optimizer:
  weight_decay: 0.1
  gradient_clip:
    max_norm: 0.1

# Hardware configuration
hardware:
  n_gpu: 1
  # Aligned to the project-wide policy so SAM3 results are seed/determinism-
  # comparable with the other models. Set deterministic=false to restore SAM3's
  # faster non-deterministic cudnn kernels (wired via trainers/sam3_adapter.py).
  deterministic: true
  seed: 42
  gpu_ids: [0]

# Output configuration
output:
  dir: logs
  is_pretrain: true

# Visualization
visualization:
  num_samples: 10

# WandB configuration (project/entity inherited from config/wandb/*.yaml — the
# single shared "medfm" project every job_type logs into)
wandb:
  log_model: false                    # SAM3 checkpoints are large

# Override the resolution + num_classes on top of the inherited `data:
# dynamic` group (same BUSBRA/BUSI/B datasets, splits, and balanced sampling
# as every other model) — SAM3's native input resolution is much larger than
# SAM's 224. `auto_img_size_by_sam_type` only fires when `model.sam_type` is
# set (SAM vit_b/l/h), so it doesn't touch this override.
# num_classes is pinned to 1 (binary) because
# tools/generate_sam3_coco_annotations.py's default run — and
# SAM3TrainerAdapter._extract_pred_gt_masks, which only ever pulls a single
# matched mask channel — both assume one "lesion" category, not per-class
# one-hot channels. dynamic.yaml's own default (3) would silently route
# Evaluator_seg into its multiclass path and produce all-NaN metrics.
data:
  img_size: 1008
  num_classes: 1
