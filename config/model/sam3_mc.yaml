# @package _global_
# SAM3 MULTICLASS fine-tune config — identical to config/model/sam3.yaml except
# it points at the multiclass COCO manifest (benign/malignant categories,
# generated by `generate_sam3_coco_annotations.py --num-classes 3 --out-dir
# datasets/sam3_coco_mc`). SAM3's native COCO loader
# (model/sam3_vendor/sam3/train/data/coco_json_loaders.py) is inherently
# per-category — it creates one grounding query per category (using the
# category *name* as the text prompt) with negatives — so training on this
# manifest teaches distinct "benign" vs "malignant" groundings with no loss
# change.
#
# data.num_classes stays 1 on purpose: the trainer's Evaluator_seg call then
# reports a binary foreground Dice (for best-checkpoint selection / convergence
# only). Per-class discrimination is NOT judged here — that would be masked by
# foreground Dice — but by a separate sanity eval that runs the real
# Sam3Teacher(num_classes=3) per-class grounding on val GT (Phase B check).
#
#   uv run train.py model=sam3_mc                      # gpu6
defaults:
  - sam3
  - _self_

sam3:
  coco_manifest: datasets/sam3_coco_mc/manifest.json
