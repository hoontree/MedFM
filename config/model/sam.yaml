# @package _global_
defaults:
  - _self_
  - /training: sam_training

trainer:
  _target_: trainers.sam_trainer.SAMTrainer

model:
  name: sam
  _target_: model.sam_hybrid_adapter.LoRA_Sam
  # SAM backbone variant: vit_b | vit_l | vit_h (override: model.sam_type=vit_l).
  # Backbone ckpt auto-resolved per variant; override with model.sam_checkpoint=<path>.
  sam_type: vit_b
  sam_checkpoint: null
  img_size: ${data.img_size}
  num_classes: ${data.num_classes}
  pixel_mean: [123.675, 116.28, 103.53]
  pixel_std: [58.395, 57.12, 57.375]
  encoder_mode: "ft"
  decoder_mode: "ft"
  r_e: 4
  r_d: 4
  conv_lora_expert_num: 4
  # Activation checkpointing on the ViT blocks (training only). Set true for
  # full fine-tuning vit_h at img_size 1024 to avoid OOM.
  use_grad_checkpoint: false
  checkpoint: null
  binary_checkpoint: experiment_results/SAM_binary_ft/checkpoints/best_epoch_43_dice_0.7637.pth
  # vit_b full-FT @224, 3-class (bg/benign/malignant), val Dice 0.7155 (2026-07-13, unified
  # recipe: AMP + backbone_lr_scale=0.1). Replaces the old 0.5694 (legacy recipe) for
  # recipe-consistency across the multiclass teacher-strength spectrum.
  multiclass_checkpoint: logs/train/sam/20260713_050019_vit_b_mc224_bs32_lr0.0001_encoder_ft_re4/checkpoints/best_epoch_23_dice_0.7155.pth