# @package _global_
# Training configuration
training:
  num_epochs: 1000
  lr: 0.0001
  warmup_epochs: 2
  batch_size: 32
  num_workers: 4
  dice_weight: 0.8
  moe_loss_weight: 100
  warmup:
    enabled: true
    steps: 200
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.000001

# Optimizer configuration
optimizer:
  weight_decay: 0.01
  gradient_clip:
    max_norm: 1.0

# Scheduler configuration
scheduler:
  use_reduce_on_plateau: false
  total_iters: 5000
  power: 0.9
  min_lr: 1e-6

# Hardware configuration
hardware:
  gpu_ids: [1]
  seed: 42

# Output configuration
output:
  dir: logs

# Visualization
visualization:
  num_samples: 10

# W&B settings live in the `wandb` config group (config/wandb/train.yaml),
# selected via the entrypoint's defaults list. Run name/group/tags are
# auto-composed in utils/wandb_utils.py; the full resolved config is logged.