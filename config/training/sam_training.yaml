# @package _global_
# Training configuration
training:
  num_epochs: 1000
  lr: 0.0001
  warmup_epochs: 2
  batch_size: 16
  num_workers: 4
  limit_train_batches: null
  dice_weight: 0.8
  moe_loss_weight: 100
  # Iter-based warmup used by some trainers (kept in sync with scheduler.warmup_iters)
  warmup:
    enabled: true
    steps: 200
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.000001

# Optimizer configuration
optimizer:
  weight_decay: 0.01
  gradient_clip:
    max_norm: 1.0

# Scheduler configuration
scheduler:
  use_reduce_on_plateau: false
  total_iters: 5000
  power: 0.9
  min_lr: 1e-6

# Hardware configuration
hardware:
  gpu_ids: [0]
  seed: 42

# Output configuration
output:
  dir: logs

# Visualization
visualization:
  num_samples: 10

# Wandb configuration
wandb:
  project: medical_foundation_models
  entity: hheo
  log_model: true