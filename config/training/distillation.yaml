#@package _global_

# Distillation Training configuration
training:
  num_epochs: 1000
  lr: 0.0001           # Learning rate for student
  teacher_lr: 0.00001  # Learning rate for teacher (online distillation only)
  warmup_epochs: 5
  batch_size: 8
  num_workers: 8
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 1e-6

# Optimizer configuration
optimizer:
  weight_decay: 0.01
  gradient_clip:
    max_norm: 1.0

# Scheduler configuration
scheduler:
  _target_: utils.schedule.CosineAnnealingWarmupLR
  warmup_epochs: ${training.warmup_epochs}
  num_epochs: ${training.num_epochs}
  base_lr: ${training.lr}
  min_lr: 1e-6

wandb:
  project: distill
  group: sam_to_usfm_multiclass
  run_name: distill_from_pretrained_sam
  entity: hheo
  log_model: true
  log_config:
    teacher: ${teacher}
    student: ${student}
    training:
      lr: ${training.lr}
      batch_size: ${training.batch_size}
      num_epochs: ${training.num_epochs}
    data:
      num_classes: ${data.num_classes}