#@package _global_

# Distillation Training configuration
training:
  num_epochs: 1000
  lr: 0.0001           # Learning rate for student
  warmup_epochs: 5
  batch_size: 8
  num_workers: 8
  limit_train_batches: null
  early_stopping:
    enabled: true
    patience: 30
    min_delta: 1e-6

# Optimizer configuration
optimizer:
  weight_decay: 0.01
  gradient_clip:
    max_norm: 1.0

# Scheduler configuration
scheduler:
  _target_: utils.schedule.CosineAnnealingWarmupLR
  warmup_epochs: ${training.warmup_epochs}
  max_epochs: ${training.num_epochs}
  base_lr: ${training.lr}
  min_lr: 1e-6

# Distillation dataset split configuration
distillation:
  enabled: true
