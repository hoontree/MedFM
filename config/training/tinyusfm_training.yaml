# @package _global_

# Training settings
training:
  lr: 1e-4                      # Learning rate
  batch_size: 16
  num_epochs: 1000
  warmup_epochs: 5
  train_head_only: false           # Train only decoder parts
  num_workers: 8
  save_interval: 20               # Save checkpoint every N epochs
  dice_weight: 0.8                # Weight for Dice loss in combined loss
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 1e-6

# Optimizer configuration
optimizer:
  _target_: torch.optim.AdamW
  lr: ${training.lr}
  weight_decay: 0
  betas: [0.9, 0.999]
  # Custom flags for TinyUSFMTrainer
  use_layer_decay: true
  num_layers: 12
  layer_decay: 0.8
  gradient_clip:
    max_norm: 1.0

# Scheduler settings
scheduler:
  _target_: utils.schedule.WarmupPolyLR
  warmup_epochs: ${training.warmup_epochs}
  num_epochs: ${training.num_epochs}
  base_lr: ${training.lr}
  end_lr: 1e-6
  power: 0.9

hardware:
  n_gpus: 1
  seed: 42
  deterministic: 1
  gpu_ids: [3]

# Output configuration
output:
  dir: logs
  is_pretrain: true               # Pretrained or scratch

# Visualization
visualization:
  num_samples: 10                 # Number of samples to visualize during test

# W&B settings live in the `wandb` config group (config/wandb/train.yaml),
# selected via the entrypoint's defaults list. Run name/group/tags are
# auto-composed in utils/wandb_utils.py; the full resolved config is logged.