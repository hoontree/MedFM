name: "BUSBRA"
type: "SegBase"
num_classes: 1  # Binary: 1, Multiclass: 3 (background=0, benign=1, malignant=2)
multiclass: false  # Set true + num_classes=3 for multiclass training
img_size: 224  # Resize images to 224x224 for training and evaluation
auto_img_size_by_sam_type: true
sam_img_size_map:
  vit_b: 224
  vit_l: 1024
  vit_h: 1024
path:
  root: "/home/hheo/data/Ultrasound/seg/breast/BUSBRA"
  split:
    train: "train"
    val: "val"
    test: "test"
    vis:
      samples: 16
      interval: 10
extensions: [".png"]
image_dir: "Images"
mask_dir: "Masks"
image_prefix: "bus_"
mask_prefix: "mask_"
batch_size: 8
num_workers: 4
pin_memory: true

# Dataset info
# Total: 1875 images (left/right breast images)
# Binary masks (background: 0, lesion: 1)
# Grayscale images with varying sizes
# Split files: busbra_train.txt, busbra_val.txt, busbra_test.txt in root directory
