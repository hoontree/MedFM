# Dynamic Data Configuration
# Use this to specify datasets at runtime via command line:
# python distill.py data=dynamic data.train='[BUSI,BUSBRA]' data.test='[BUID,BUS_UCLM]'

name: "dynamic"
type: "Dynamic"
train: [BUSBRA, BUSI, B]
val: []   # If empty, defaults to same as train (using val split)
test: [BUID, BUS_UCLM, BUS_UCLM_filtered]  # Each dataset in this list will be evaluated separately

# Canonical location for num_classes, img_size, and multiclass mode.
# These are propagated to every individual dataset at load time.
# To enable multiclass training, override both from CLI:
# data.num_classes=3
num_classes: 1
img_size: 224
auto_img_size_by_sam_type: true
sam_img_size_map:
  vit_b: 224
  vit_l: 1024
  vit_h: 1024
normalization: "imagenet"
